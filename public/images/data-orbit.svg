<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title>Orbites Data Camerhub</title>
  <desc>Orbites lumineuses représentant l’observabilité et la data</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1225" />
    </linearGradient>
    <radialGradient id="pulseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="560" height="420" rx="28" fill="url(#bgGradient)" />
  <circle cx="180" cy="150" r="120" fill="url(#pulseGradient)" opacity="0.45" />
  <circle cx="400" cy="250" r="140" fill="url(#pulseGradient)" opacity="0.35" />

  <g fill="none" stroke="#3f37c9" stroke-opacity="0.5" stroke-width="1.6">
    <circle cx="280" cy="210" r="160" />
    <circle cx="280" cy="210" r="110" />
    <circle cx="280" cy="210" r="70" />
  </g>

  <g fill="#f1f5ff">
    <circle cx="420" cy="120" r="6" />
    <circle cx="160" cy="280" r="5" />
    <circle cx="280" cy="210" r="8" fill="#4cc9f0" />
    <circle cx="330" cy="320" r="5" fill="#f72585" />
    <circle cx="210" cy="120" r="4" fill="#4cc9f0" />
  </g>

  <path d="M130 240 C200 140 360 140 430 260" stroke="#4cc9f0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 14" />
</svg>
